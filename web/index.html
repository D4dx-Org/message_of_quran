<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Read The Message of the Qur'an by Muhammad Asad with the Malayalam translation by K.C. Saleem — all 114 surahs verse by verse with footnotes, the full Mus'haf, recitations and hadith links. Free on web, Android and iOS.">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://quranasadmalayalam.in/">
  <meta name="theme-color" content="#1B4571">
  <meta name="author" content="D4DX Innovations LLP">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
  <link rel="alternate" hreflang="en" href="https://quranasadmalayalam.in/">
  <link rel="alternate" hreflang="ml" href="https://quranasadmalayalam.in/">
  <link rel="alternate" hreflang="x-default" href="https://quranasadmalayalam.in/">
  <meta property="og:locale" content="en_IN">
  <meta property="og:locale:alternate" content="ml_IN">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Quran Asad Malayalam">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Open Graph / link-preview card (WhatsApp, Facebook, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Quran Asad Malayalam">
  <meta property="og:title" content="Quran Asad Malayalam">
  <meta property="og:description" content="Read the Holy Qur'an with Muhammad Asad's translation and Malayalam translation, verse by verse, free on web, Android and iOS.">
  <meta property="og:image" content="https://quranasadmalayalam.in/icons/Icon-512.png">
  <meta property="og:url" content="https://quranasadmalayalam.in">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Quran Asad Malayalam">
  <meta name="twitter:description" content="Read the Holy Qur'an with Muhammad Asad's translation and Malayalam translation, verse by verse, free on web, Android and iOS.">
  <meta name="twitter:image" content="https://quranasadmalayalam.in/icons/Icon-512.png">

  <title>Quran Asad Malayalam — The Message of the Qur'an in Malayalam &amp; English</title>
  <link rel="manifest" href="manifest.json">

  <!-- The engine and the app bundle are the whole critical path, and the
       browser only discovers main.dart.js after flutter_bootstrap.js has run.
       Preloading starts that 1.26 MB download while the HTML is still being
       parsed. canvaskit is deliberately not preloaded: which variant the
       engine picks depends on the browser, and guessing wrong costs 1.9 MB. -->
  <link rel="preload" as="script" href="main.dart.js">

  <style>
    /* Critical CSS only — everything the first paint needs, inline, so the
       shell appears with the HTML rather than after a stylesheet round trip. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #194874; /* AppTheme.appThemeSplash, so the handoff to the
                              Flutter splash is invisible */
    }
    #app-shell {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #194874;
      color: #F4F7FF;
      font-family: Georgia, 'Times New Roman', serif;
      text-align: center;
      z-index: 2147483647;
      transition: opacity 220ms ease-out;
      /* Painted by the browser's compositor, so the fade cannot jank the
         first Flutter frame underneath it. */
      will-change: opacity;
    }
    #app-shell.is-done { opacity: 0; pointer-events: none; }
    #app-shell .shell-mark {
      font-size: 13px;
      letter-spacing: 3px;
      opacity: 0.75;
      margin-bottom: 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #app-shell .shell-title {
      font-size: clamp(26px, 7vw, 44px);
      line-height: 1.18;
      letter-spacing: 1px;
      margin: 0;
      font-weight: 700;
    }
    #app-shell .shell-title span {
      display: block;
      font-size: 0.42em;
      letter-spacing: 4px;
      font-weight: 400;
      opacity: 0.8;
      margin: 6px 0;
    }
    #app-shell .shell-progress {
      width: min(220px, 52vw);
      height: 2px;
      margin-top: 34px;
      background: rgba(244, 247, 255, 0.18);
      border-radius: 2px;
      overflow: hidden;
    }
    #app-shell .shell-progress::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: #E4B95B;
      border-radius: 2px;
      animation: shell-slide 1.15s ease-in-out infinite;
    }
    @keyframes shell-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-shell .shell-progress::after { animation: none; width: 100%; }
      #app-shell { transition: none; }
    }
    #app-shell .shell-footer {
      position: absolute;
      bottom: 26px;
      font-size: 11px;
      letter-spacing: 1px;
      opacity: 0.55;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Structured data. The app itself renders to a canvas, so this and the
       tags above are the only description of the site a crawler can read. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://quranasadmalayalam.in/#website",
        "url": "https://quranasadmalayalam.in/",
        "name": "Quran Asad Malayalam",
        "description": "The Message of the Qur'an by Muhammad Asad with the Malayalam translation by K.C. Saleem.",
        "inLanguage": ["en", "ml"],
        "publisher": { "@id": "https://quranasadmalayalam.in/#publisher" }
      },
      {
        "@type": "Organization",
        "@id": "https://quranasadmalayalam.in/#publisher",
        "name": "D4DX Innovations LLP",
        "url": "https://d4dx.co"
      },
      {
        "@type": "Book",
        "name": "The Message of the Qur'an",
        "author": { "@type": "Person", "name": "Muhammad Asad" },
        "translator": { "@type": "Person", "name": "K.C. Saleem" },
        "inLanguage": ["en", "ml"],
        "url": "https://quranasadmalayalam.in/"
      },
      {
        "@type": "WebApplication",
        "name": "Quran Asad Malayalam",
        "url": "https://quranasadmalayalam.in/",
        "applicationCategory": "BookApplication",
        "operatingSystem": "Web, Android, iOS",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
      }
    ]
  }
  </script>

</head>
<body>
  <noscript>
    <h1>Quran Asad Malayalam</h1>
    <p>
      The Message of the Qur'an by Muhammad Asad, with the Malayalam
      translation by K.C. Saleem: all 114 surahs verse by verse with Asad's
      footnotes, the complete Mus'haf, recitations by renowned reciters, and
      links to other Qur'an and hadith translations. Free to read, with no
      advertising.
    </p>
    <p>
      This site needs JavaScript. It is also available as an
      <a href="https://play.google.com/store/apps/details?id=com.d4dx.quranasadmalayalam">Android app</a>
      and an iOS app.
    </p>
  </noscript>
  <!-- The shell the browser can paint from the HTML alone: same colour and
       wording as the Flutter splash that replaces it, so the transition is a
       cross-fade rather than a jump. No images and no webfonts, so it costs
       no extra request and appears as soon as the document arrives. -->
  <div id="app-shell">
    <div class="shell-mark">THE</div>
    <h1 class="shell-title">MESSAGE<span>OF THE</span>QURAN</h1>
    <div class="shell-progress" role="progressbar" aria-label="Loading"></div>
    <div class="shell-footer">Powered by D4DX</div>
  </div>

  <script>
    (function () {
      var shell = document.getElementById('app-shell');
      if (!shell) return;
      var removed = false;
      function dismiss() {
        if (removed) return;
        removed = true;
        shell.classList.add('is-done');
        // Outlast the fade, then stop paying for the element at all.
        setTimeout(function () {
          if (shell.parentNode) shell.parentNode.removeChild(shell);
        }, 260);
      }
      window.addEventListener('flutter-first-frame', dismiss);
      // If the engine never gets that far the app shows its own error screen,
      // which the shell would otherwise cover forever.
      setTimeout(dismiss, 20000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
