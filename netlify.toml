# ─────────────────────────────────────────────────────────────────────────────
# Netlify configuration — Flutter Web (The Message of the Quran)
# ─────────────────────────────────────────────────────────────────────────────

[build]
  # Repo root IS the Flutter project, so no "base" needed.
  command = """
    git clone https://github.com/flutter/flutter.git \
      --branch stable --depth 1 flutter_sdk && \
    export PATH="$PATH:$(pwd)/flutter_sdk/bin" && \
    flutter_sdk/bin/flutter config --no-analytics && \
    flutter_sdk/bin/flutter pub get && \
    flutter_sdk/bin/flutter build web --release
  """
  publish = "build/web"

[build.environment]
  # Prevents pub from showing prompts
  PUB_ENVIRONMENT = "bot.netlify"
  # The Flutter SDK's dartdev snapshot contains hardcoded Google Analytics
  # test keys (AIza***) that trigger Netlify's smart secrets scanner.
  # These are false positives — not actual project secrets.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# ─────────────────────────────────────────────────────────────────────────────
# Security & SharedArrayBuffer headers (required for sqflite_common_ffi_web)
# Cross-Origin-Embedder-Policy + Cross-Origin-Opener-Policy enable
# SharedArrayBuffer which the SQLite WASM worker depends on.
# ─────────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Embedder-Policy  = "credentialless"
    Cross-Origin-Opener-Policy    = "same-origin"
    X-Frame-Options               = "SAMEORIGIN"
    X-Content-Type-Options        = "nosniff"
    Referrer-Policy               = "strict-origin-when-cross-origin"

# Keep critical runtime assets revalidated on each load to avoid stale
# persisted/cached DB and wasm artifacts after deploy. "no-cache" (not
# "no-store") lets the browser reuse unchanged bytes via a cheap 304 instead
# of re-downloading the full asset (54.5MB for the DB) on every load.
[[headers]]
  for = "/assets/db/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sqlite3.wasm"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sqflite_sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ─────────────────────────────────────────────────────────────────────────────
# Static asset caching — images/icons/data aren't filename-hashed, so 1 week
# balances instant repeat loads against a redeployed asset going stale.
# canvaskit/* is versioned by the Flutter SDK build itself, safe to cache hard.
# ─────────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/data/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─────────────────────────────────────────────────────────────────────────────
# SPA redirect — Flutter web is a single-page app.
# All routes must fall back to index.html (200, not 301/302).
# ─────────────────────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
