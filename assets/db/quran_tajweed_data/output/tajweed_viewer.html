<style>
/* Quran Tajweed Colors - matches quran.com color scheme */
tajweed[class=ham_wasl]        { color: #AAAAAA; }
tajweed[class=laam_shamsiyah]  { color: #AAAAAA; }
tajweed[class=madda_normal]    { color: #537FFF; }
tajweed[class=madda_permissible] { color: #4050FF; }
tajweed[class=madda_necessary] { color: #000FB3; }
tajweed[class=madda_obligatory] { color: #2144C1; }
tajweed[class=qalaqala]        { color: #DD0008; }

tajweed[class=ikhpiaa_shafawi] { color: #D500B7; }

tajweed[class=ghunnah]         { color: #FF7E1E; }
span[class=end] { color: #000; font-size: 0.85em; }

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #faf6ee; padding: 20px; }
.container { max-width: 840px; margin: 0 auto; }
h1 { text-align: center; color: #1a4d2e; font-size: 22px; margin-bottom: 6px; direction: ltr; }
h2 { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; direction: ltr; font-weight: normal; }
.surah-header { background: #1a4d2e; color: #fff; padding: 12px 20px; border-radius: 8px;
  text-align: center; margin: 20px 0 10px; font-size: 18px; direction: ltr; }
.verse { background: #fff; border: 1px solid #e0d8c8; border-radius: 8px; padding: 20px 24px;
  margin: 8px 0; font-size: 28px; line-height: 2.2; text-align: right; direction: rtl; }
.verse-num { font-size: 11px; color: #999; direction: ltr; text-align: left; margin-bottom: 4px; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
  gap: 6px; padding: 16px; background: #fff; border-radius: 8px; margin-bottom: 16px;
  direction: ltr; text-align: left; border: 1px solid #e0d8c8; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
select { display: block; margin: 10px auto; padding: 8px 16px; font-size: 15px;
  border-radius: 6px; border: 1px solid #ccc; direction: ltr; }
</style>
